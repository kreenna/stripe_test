services:
  web:
    container_name: web
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers $$(($$(nproc) * 2 + 1)) --log-level=debug"
    ports:
      - 8000:8000
    restart: on-failure
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/app
      - ./static_volume:/var/www/static
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:15-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env

  nginx:
    container_name: nginx
    image: nginx:1.23.0-alpine
    ports:
      - "80:80"
    restart: on-failure
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static_volume:/var/www/static
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: